name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_BASE_PATH: /PORTFOLIO
      GITHUB_USERNAME: ${{ vars.GH_USERNAME || 'CL4-Bisk' }}
      GITHUB_ALLOWED_REPOS: ${{ vars.GH_ALLOWED_REPOS }}
      GITHUB_TOKEN_PERSONAL: ${{ secrets.GH_TOKEN_PERSONAL }}
      GITHUB_TOKEN_UPDIKO: ${{ secrets.GH_TOKEN_UPDIKO }}
      GITHUB_TOKEN_TWOBIT_FORGE: ${{ secrets.GH_TOKEN_TWOBIT_FORGE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
